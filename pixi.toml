# pixi.toml
[workspace]
name = "pixi-firedrake-example"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
# Lock file is format v7 (pixi >= 0.68); 0.84 changed lock-file hashes.
requires-pixi = ">=0.84"

# Base dependencies (always included)
[dependencies]
python = ">=3.11,<3.14"
pip = "*"

# Requirements to build PETSc (and Firedrake). Unlike PETSc, ABI compatibility
# for these dependencies isn't needed, so pre-compiled binaries from Conda packages 
# are acceptable.
[feature.firedrake-build.dependencies]
git = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
make = "*"
curl = "*"
flex = "*"
bison = "*"
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"
openmpi = "*"
libblas = "*"
liblapack = "*"
zlib = "*"

[feature.firedrake-build.tasks]
get-configure = "curl -o $CONDA_PREFIX/firedrake-configure https://raw.githubusercontent.com/firedrakeproject/firedrake/release/scripts/firedrake-configure"

_clone-petsc = { cmd = "bash scripts/clone-petsc.sh", depends-on = ["get-configure"] }

check = "firedrake-check"

[feature.firedrake-build.tasks._build-petsc]
args = [
  { arg = "arch", default = "default", choices = ["default", "complex"] },
  { arg = "extras", default = "" },
  { arg = "petsc_opts", default = "" },
]
cmd = "bash scripts/build-petsc.sh {{ arch }} \"{{ extras }}\" \"{{ petsc_opts }}\""
# Overrides the PETSC_ARCH auto-detected by scripts/activate.sh.
env = { PETSC_ARCH = "arch-firedrake-{{ arch }}" }
depends-on = ["_clone-petsc"]

[feature.firedrake-build.tasks._install-firedrake]
args = [
  { arg = "arch", default = "default", choices = ["default", "complex"] },
  { arg = "extras", default = "" },
  { arg = "petsc_opts", default = "" },
]
cmd = "bash scripts/install-firedrake.sh \"{{ extras }}\""
# Overrides the PETSC_ARCH auto-detected by scripts/activate.sh.
env = { PETSC_ARCH = "arch-firedrake-{{ arch }}" }
depends-on = [
  {task = "_build-petsc", args = ["{{ arch }}", "{{ extras }}", "{{ petsc_opts }}"]},
]

[feature.firedrake-build.tasks.setup]
args = [
  { arg = "arch", default = "default", choices = ["default", "complex"] },
  { arg = "extras", default = "" },
  { arg = "petsc_opts", default = "" },
]
depends-on = [
  {task= "_install-firedrake", args=["{{ arch }}", "{{ extras }}", "{{ petsc_opts }}"]}
]

[feature.firedrake-build.activation]
scripts = ["scripts/activate.sh"]

# Static variables. Anything that depends on PETSC_ARCH is set in
# scripts/activate.sh instead.
[feature.firedrake-build.activation.env]
PETSC_DIR = "$CONDA_PREFIX/petsc"
# MPI compiler wrappers
CC = "mpicc"
CXX = "mpicxx"
# Build h5py against PETSc's parallel HDF5
HDF5_MPI = "ON"
# PyOP2 JIT compilation flags. PyOP2's `sniff_compiler` doesn't recognise the
# Conda compiler version strings (arch-conda-os-*) and falls back to
# AnonymousCompiler, which doesn't set these.
PYOP2_CFLAGS = "-fPIC"
PYOP2_LDFLAGS = "-shared"

# Default environment includes firedrake-build
[environments]
default = { features = ["firedrake-build"], solve-group = "default" }